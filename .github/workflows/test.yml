name: Analyze and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env from secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --fatal-infos --fatal-warnings > analyze.txt 2>&1 || {
            grep -E "(error|warning|info) •" analyze.txt | head -15 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Run tests
        run: flutter test
